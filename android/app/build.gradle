plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

// The rule this whole port lives by: nothing below is a copy of anything.
// The CLI, the backend and the whole of the page are staged out of the
// repository root at build time and are never checked in a second time, so a
// change to `web/app.js` is in the next APK because there is no other
// `app.js` for it not to be in. `build-apk` reads the version from `build-deb`
// for the same reason - one place names a version, and it is not this file.
def repoRoot = rootProject.file("..")
def staged = layout.buildDirectory.dir("staged-assets")

// Real files, at real paths, rather than Python modules. The CLI is called
// `simplmusik` with no `.py` on it and is imported by path everywhere already
// (see `server.py`), and the page is read off the disk by the same server that
// serves it on a desktop. Laying them out on the device exactly as they sit in
// the repository is what lets both go on being true here.
// A Sync rather than a Copy: a file gone from the repository is gone from the
// APK too, instead of lingering in the staged folder from some earlier build.
// Syncthing's conflict copies sit beside the real files and are never app.
def stageAssets = tasks.register("stageAssets", Sync) {
    into staged
    from(repoRoot) { include "simplmusik", "server.py" }
    from(repoRoot) { include "web/**" }
    exclude "**/*.sync-conflict-*"
    // A build that quietly staged nothing would produce an APK that starts and
    // then has no app in it, which is a bad way to find out.
    doLast {
        def cli = new File(staged.get().asFile, "simplmusik")
        if (!cli.exists()) throw new GradleException("staged no CLI from ${repoRoot}")
    }
}

// The launcher icon is the one thing here that is drawn rather than staged.
// The mark in `web/favicon.png` is white with nothing behind it, which is
// right in a browser tab and invisible on a launcher, and a launcher icon
// wants a shape a 64px favicon has no pixels for. So `res/` holds a real one -
// the same mark, on the app's own accent, laid out for an adaptive icon. It is
// art, not app: nothing about it can fall out of step with the code.
android {
    namespace "org.simplmusik.player"
    compileSdk 36

    defaultConfig {
        applicationId "org.simplmusik.player"
        minSdk 26
        targetSdk 36
        versionCode project.findProperty("versionCode") ? project.property("versionCode") as Integer : 1
        versionName project.findProperty("versionName") ?: "0.0.0-dev"

        // One ABI on purpose. Every extra one carries another whole CPython,
        // and a phone from the last several years is arm64. The emulator is
        // the exception - it is x86_64, being a desktop pretending - so this
        // is asked for rather than fixed, and `build-apk --abi` sets it.
        ndk { abiFilters(*(project.findProperty("abi") ?: "arm64-v8a").split(",")) }

        python {
            version "3.11"
            pip {
                // The only two things the CLI imports that aren't the standard
                // library, and both are pure Python - which is the reason this
                // port is a build and not a rewrite. Nothing here compiles.
                install "mutagen"
                install "yt-dlp"
                install "numpy"      // the fingerprint `identify` sends Shazam
            }
        }
    }

    sourceSets {
        main { assets.srcDirs += staged }
    }

    buildTypes {
        debug   { applicationIdSuffix ".debug" }
        release {
            minifyEnabled false          // the Python is the bulk, not the Java
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions { jniLibs { useLegacyPackaging false } }
}

// Both staged folders are inputs to a good number of AGP's tasks, and AGP
// names them per variant and adds to the list between versions. So they are
// matched rather than listed, and matched loosely: a task that did not in fact
// need waiting for has lost nothing by waiting, and the one that is missed
// from a tighter list fails the build with a race that reads like a bug in
// something else.
tasks.configureEach { t ->
    if (t.name.startsWith("stage")) return          // the staging itself
    if (t.name.contains("Assets") || t.name.contains("Resources")
            || t.name.contains("SourceSetPaths") || t.name.contains("Manifest")) {
        t.dependsOn(stageAssets)
    }
}

// The packager puts every file it finds under the compressed assets into the
// APK, whatever it is called. Syncthing downloads into `.syncthing.<name>.tmp`
// beside the real file, so a half-synced `.syncthing.server.py.jar.tmp` is a
// second `assets/server.py` and the build dies with "already contains entry
// 'assets/server.py', cannot overwrite". `.stignore` keeps the build tree out
// of the sync; this sweeps up anything that got in before it did.
def sweepSyncDebris = tasks.register("sweepSyncDebris", Delete) {
    delete fileTree(layout.buildDirectory) {
        include "**/.syncthing.*", "**/*.sync-conflict-*", "**/~syncthing~*"
        exclude "outputs/**"
    }
}
tasks.configureEach { t ->
    if (t.name ==~ /package(Debug|Release)/) t.dependsOn(sweepSyncDebris)
}

dependencies {
    // Chaquopy asks for the Kotlin standard library as three artifacts, the
    // way it was published before 1.8; everything else here asks for the one
    // it became. Both arrive, and the classes that moved are then in the build
    // twice. The BOM is what settles it: at a version past the merge, the two
    // extra artifacts are stubs pointing at the one, and there is a single
    // copy of every class again.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.24")

    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"
    // The media session: what the notification, the lock screen and a pair
    // of headphones read what is playing from, and send their buttons to.
    implementation "androidx.media3:media3-session:1.4.1"
}
