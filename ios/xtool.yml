# How the Swift package below becomes an iOS app.
#
# `resources` is the whole of the staging: `build-ipa` lays the CLI, the
# backend and the page into `app/` out of the repository root, exactly as
# `build-apk` has Gradle do on the other phone, and this line is what carries
# that folder into the bundle. Nothing in here is a second copy of anything.
version: 1
bundleID: org.simplmusik.player
product: Simplmusik
infoPath: Info.plist
resources:
  - app
